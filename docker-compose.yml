services:
  bot:
    image: node:18-alpine
    restart: "always"
    user: node
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    working_dir: /app
    entrypoint: "npm run start"

  make:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install --quiet && npm run build"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  node_modules:
